name: bus2
description: "Desafio técnico para a empresa Bus2."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.1

environment:
  sdk: ^3.6.1


dependencies:
  all_validations_br: ^3.2.3
  bloc: ^9.0.0
  cached_network_image: ^3.4.1
  change_app_package_name: ^1.5.0
  dio: ^5.8.0+1
  equatable: ^2.0.7
  file_picker: ^8.1.6
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  flutter_dotenv: ^5.2.1
  flutter_localizations:
    sdk: flutter
  flutter_polyline_points: ^2.1.0
  flutter_svg: ^2.0.17
  font_awesome_flutter: ^10.8.0
  get_it: ^8.0.3
  get_storage: ^2.1.1
  go_router: ^14.8.1
  image_picker: ^1.1.2
  intl: any
  lottie: ^3.3.1
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  result_dart: ^2.0.0
  share_plus: ^11.0.0
  shared_preferences: ^2.3.3
  shimmer: ^3.0.0
  skeletonizer: ^2.1.2
  url_launcher: ^6.3.1

  
  
  
  
dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.4.14
  flutter_gen_runner: ^5.8.0
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  network_image_mock: ^2.1.1
  very_good_analysis: ^7.0.0

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/png/icon_app.png"
  min_sdk_android: 16
  # to run: flutter pub run flutter_launcher_icons

flutter:

  uses-material-design: true

  assets:
    - assets/images/png/
    - assets/animations/lottie/
 




  fonts:
    - family: Inter
      fonts:
        
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700

    - family: AppIconFont
      fonts:
        - asset: assets/fonts/app-icon-font/App-Icon-Font.ttf
  
 

flutter_gen:
  output: lib/ui/core/components/atoms/image/ 
  line_length: 120 
  
  fonts:
    enabled: false

  integrations:
    flutter_svg: false
    flare_flutter: false
    rive: false
    lottie: false

  assets:
    outputs:
      class_name: AppAssets
      package_parameter_enabled: false
    exclude:
      - assets/fonts/**
      - assets/svgs/**